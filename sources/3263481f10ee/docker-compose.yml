services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vulnetic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vulnetic}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vulnetic} -d ${POSTGRES_DB:-vulnetic}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  vulnetic:
    image: sordado123/vulnetic:${VULNETIC_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      VULNETIC_PG_DSN: postgres://${POSTGRES_USER:-vulnetic}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vulnetic}?sslmode=disable
      VULNETIC_SAAS_MODE: ${VULNETIC_SAAS_MODE:-false}
      VULNETIC_SIGNUP_ALLOWLIST: ${VULNETIC_SIGNUP_ALLOWLIST:-}
      # Password for the non-owner, RLS-subject "vulnetic_app" role (RLS-1 —
      # Row-Level Security defense-in-depth, see db/schema.sql §Z2). Optional:
      # empty (the default) leaves RLS-1 off, exactly as before it existed —
      # set POSTGRES_APP_PASSWORD in .env to opt in. db.Open provisions the
      # role itself; nothing here needs to create it ahead of time.
      VULNETIC_PG_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VULNETIC_LLM_PROVIDER: ${VULNETIC_LLM_PROVIDER:-}
      VULNETIC_LLM_MODEL: ${VULNETIC_LLM_MODEL:-}
      VULNETIC_LLM_BASE_URL: ${VULNETIC_LLM_BASE_URL:-}
      VULNETIC_LLM_PROXY: ${VULNETIC_LLM_PROXY:-}
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # Bind the data directory (jwt.key, SQLite, etc.) to data/ in the project root,
      # so it is easy to inspect/back up on the host and survives container rebuilds.
      - ./data:/app/data
      # Mount skills/ from the project root into the container (overriding the image's built-in /app/skills);
      # skill changes require no image rebuild — the container reads the host copy.
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
